resource:
    name: CartItems
    shortName: items
    description: 'Cart item management for authenticated customer carts'
    resourceAttributesClassName: 'Generated\Shared\Transfer\RestCartItemsAttributesTransfer'
    includedSortPriority: 100

    processor: Spryker\Glue\CartsRestApi\Api\Storefront\Processor\CartItemsStorefrontProcessor

    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        # Not servable, and never was: the legacy Glue route plugin registered only POST/PATCH/DELETE,
        # so before this change the operation answered `200 null` rather than a cart item. API Platform
        # still needs it to mint the IRI (`id` / `links.self`) of every cart item nested in a cart
        # response, so the operation stays while `NotFoundAction` + `openapi: false` keep it unreachable
        # and unadvertised, and `internal: true` states that intent for the contract coverage gate.
        - type: Get
          description: 'Internal IRI anchor for cart items; not a reachable endpoint.'
          uriTemplate: '/carts/{cartId}/items/{groupKey}'
          controller: ApiPlatform\Symfony\Action\NotFoundAction
          internal: true
          read: false
          output: false
          openapi: false
          uriVariables:
              cartId:
                  toProperty: 'cart'
                  fromClass: CartsStorefrontResource
              groupKey:
                  fromClass: CartItemsStorefrontResource

        - type: Post
          description: 'Add an item to a cart'
          uriTemplate: '/carts/{cartId}/items'
          uriVariables:
              cartId:
                  toProperty: 'cart'
                  fromClass: CartsStorefrontResource
          openapiContext:
              responses:
                  201:
                      description: 'Item added; the updated cart is returned.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token or insufficient scope.'
                  404:
                      description: 'Cart not found.'
                  422:
                      description: 'Item attributes failed validation, or the item could not be added.'

        - type: Patch
          description: 'Update item quantity in a cart'
          uriTemplate: '/carts/{cartId}/items/{groupKey}'
          read: false
          uriVariables:
              cartId:
                  identifiers: [cartId]
              groupKey:
                  identifiers: [groupKey]
          openapiContext:
              responses:
                  200:
                      description: 'Item quantity updated; the updated cart is returned.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token or insufficient scope.'
                  404:
                      description: 'Cart or cart item not found.'
                  422:
                      description: 'Item attributes failed validation, or the item could not be updated.'

        - type: Delete
          extraProperties:
              notFoundCode: '101'
              notFoundMessage: 'Cart with given uuid not found.'
          description: 'Remove an item from a cart'
          uriTemplate: '/carts/{cartId}/items/{groupKey}'
          read: false
          uriVariables:
              cartId:
                  identifiers: [cartId]
              groupKey:
                  identifiers: [groupKey]
          openapiContext:
              responses:
                  204:
                      description: 'Item removed.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Missing access token or insufficient scope.'
                  404:
                      description: 'Cart or cart item not found.'

    includes:
        - relationshipName: concrete-products
          targetResource: ConcreteProducts
          uriVariableMappings:
              sku: sku
        - relationshipName: abstract-products
          targetResource: AbstractProducts
          uriVariableMappings:
              abstractSku: sku
        - relationshipName: merchants
          targetResource: Merchants
          uriVariableMappings:
              merchantReference: merchantReference
        - relationshipName: sales-units
          targetResource: SalesUnits
          resolverClass: Spryker\Glue\ProductMeasurementUnitsRestApi\Api\Storefront\Relationship\CartItemSalesUnitsRelationshipResolver

    properties:
        groupKey:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Unique item group key identifier'
            openapiContext:
                example: '035_17360369'

        sku:
            type: string
            writable: true
            readable: true
            required: true
            description: 'Product SKU'
            openapiContext:
                example: '035_17360369'

        quantity:
            type: integer
            writable: true
            readable: true
            required: true
            description: 'Item quantity'
            openapiContext:
                example: 1

        abstractSku:
            type: string
            writable: false
            readable: true
            required: false
            description: 'Abstract product SKU'
            openapiContext:
                example: '035'

        merchantReference:
            type: string
            writable: true
            readable: true
            required: false
            responseOptional: true
            description: 'Merchant reference owning the item (marketplace). Answered alongside `productOfferReference`, and `null` with it for an item added by SKU alone.'
            openapiContext:
                example: 'MER000001'

        productOfferReference:
            type: string
            writable: true
            readable: true
            required: false
            responseOptional: true
            description: 'Product offer reference owning the item (marketplace). Answered only for an item added against a product offer; an item added by SKU alone answers `null`.'

        amount:
            type: string
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'Amount for measurement unit or packaging unit items. Answered only for an item sold in such a unit; an item of a plain product carries none.'

        calculations:
            type: object
            objectName: Calculations
            writable: false
            readable: true
            required: false
            description: 'Item price calculations including unit and sum prices'
            properties:
                unitPrice:
                    type: integer
                    description: 'Unit price in cents (gross or net per price mode).'
                    openapiContext:
                        example: 3979
                sumPrice:
                    type: integer
                    description: 'Sum price in cents (unit price × quantity).'
                    openapiContext:
                        example: 3979
                unitGrossPrice:
                    type: integer
                    description: 'Unit gross price in cents.'
                    openapiContext:
                        example: 3979
                sumGrossPrice:
                    type: integer
                    description: 'Sum gross price in cents.'
                    openapiContext:
                        example: 3979
                unitNetPrice:
                    type: integer
                    description: 'Unit net price in cents.'
                    openapiContext:
                        example: 0
                sumNetPrice:
                    type: integer
                    description: 'Sum net price in cents.'
                    openapiContext:
                        example: 0
                # BC: the legacy RestCartItemCalculationsTransfer exposes the full set of
                # tax/aggregation fields. The initial migration truncated the object to the price
                # fields above, dropping taxRate + the *PriceToPayAggregation/*SubtotalAggregation
                # fields that cart/guest-cart item tests assert. The mapper already populates them
                # (fromArray passthrough); declare them so they serialize again. (The discount and
                # product-option aggregation fields are owned by DiscountsRestApi and
                # ProductOptionsRestApi respectively; they are also re-declared below, deprecated,
                # so a partial update lacking those new modules still serializes them.)
                taxRate:
                    type: integer
                    description: 'Tax rate applied to the item, in percent.'
                    openapiContext:
                        example: 19
                unitTaxAmountFullAggregation:
                    type: integer
                    description: 'Aggregated tax amount per unit in cents.'
                    openapiContext:
                        example: 635
                sumTaxAmountFullAggregation:
                    type: integer
                    description: 'Aggregated tax amount for the sum in cents.'
                    openapiContext:
                        example: 635
                unitPriceToPayAggregation:
                    type: integer
                    description: 'Price to pay per unit after all aggregations, in cents.'
                    openapiContext:
                        example: 3616
                sumPriceToPayAggregation:
                    type: integer
                    description: 'Price to pay for the sum after all aggregations, in cents.'
                    openapiContext:
                        example: 3616
                unitSubtotalAggregation:
                    type: integer
                    description: 'Aggregated subtotal per unit in cents.'
                    openapiContext:
                        example: 3979
                sumSubtotalAggregation:
                    type: integer
                    description: 'Aggregated subtotal for the sum in cents.'
                    openapiContext:
                        example: 3979
                # Deprecated dual-declaration: the six fields below are owned by DiscountsRestApi
                # (discount*) and ProductOptionsRestApi (productOption*). Re-declared here, identical,
                # so a partial update shipping the new CartsRestApi without the new domain modules
                # still serializes them. Deep-merge unions them when those modules are present, so
                # this is idempotent. Kept one release cycle, then removed.
                unitDiscountAmountAggregation:
                    type: integer
                    description: 'Deprecated here (owned by DiscountsRestApi); kept one release cycle for partial-update safety. Aggregated discount amount per unit in cents.'
                    openapiContext:
                        example: 363
                sumDiscountAmountAggregation:
                    type: integer
                    description: 'Deprecated here (owned by DiscountsRestApi); kept one release cycle for partial-update safety. Aggregated discount amount for the sum in cents.'
                    openapiContext:
                        example: 363
                unitDiscountAmountFullAggregation:
                    type: integer
                    description: 'Deprecated here (owned by DiscountsRestApi); kept one release cycle for partial-update safety. Fully aggregated discount amount per unit in cents.'
                    openapiContext:
                        example: 363
                sumDiscountAmountFullAggregation:
                    type: integer
                    description: 'Deprecated here (owned by DiscountsRestApi); kept one release cycle for partial-update safety. Fully aggregated discount amount for the sum in cents.'
                    openapiContext:
                        example: 363
                unitProductOptionPriceAggregation:
                    type: integer
                    description: 'Deprecated here (owned by ProductOptionsRestApi); kept one release cycle for partial-update safety. Aggregated product option price per unit in cents.'
                    openapiContext:
                        example: 0
                sumProductOptionPriceAggregation:
                    type: integer
                    description: 'Deprecated here (owned by ProductOptionsRestApi); kept one release cycle for partial-update safety. Aggregated product option price for the sum in cents.'
                    openapiContext:
                        example: 0

        cart:
            type: CartsStorefrontResource
            writable: false
            readable: false
            required: false
            description: 'The parent cart'
