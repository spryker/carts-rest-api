resource:
    name: GuestCarts
    shortName: guest-carts
    description: 'Guest cart management for anonymous users'

    provider: Spryker\Glue\CartsRestApi\Api\Storefront\Provider\GuestCartsStorefrontProvider
    processor: Spryker\Glue\CartsRestApi\Api\Storefront\Processor\GuestCartsStorefrontProcessor

    paginationEnabled: false

    # Guest operations are unsecured but identify their cart owner through the
    # `X-Anonymous-Customer-Unique-Id` header, so each of them answers 400 when it is absent.
    operations:
        - type: GetCollection
          description: 'Retrieve all guest carts for the anonymous user'
          openapiContext:
              responses:
                  200:
                      description: 'Guest cart collection returned.'
                  400:
                      description: 'X-Anonymous-Customer-Unique-Id header is missing.'

        - type: Get
          description: 'Retrieve a specific guest cart by UUID'
          openapiContext:
              responses:
                  200:
                      description: 'Guest cart returned.'
                  400:
                      description: 'X-Anonymous-Customer-Unique-Id header is missing.'
                  404:
                      description: 'Guest cart not found.'

        - type: Patch
          description: 'Update guest cart properties'
          openapiContext:
              responses:
                  200:
                      description: 'Guest cart updated.'
                  400:
                      description: 'X-Anonymous-Customer-Unique-Id header is missing.'
                  404:
                      description: 'Guest cart not found.'
                  422:
                      description: 'Guest cart attributes failed validation, the currency is not available (code 117), the price mode is not available (code 119), or the price mode cannot change while the cart holds items (code 111).'
                      codes:
                          - code: '111'
                            description: 'The price mode cannot change while the cart holds items.'
                          - code: '117'
                            description: 'The currency is not available.'
                          - code: '119'
                            description: 'The price mode is not available.'
                          - code: '901'
                            description: 'Request validation failed.'

    includes:
        - relationshipName: guest-cart-items
          targetResource: GuestCartItems
          resolverClass: Spryker\Glue\CartsRestApi\Api\Storefront\Relationship\GuestCartsItemsRelationshipResolver
        - relationshipName: vouchers
          targetResource: Vouchers
          resolverClass: Spryker\Glue\CartCodesRestApi\Api\Storefront\Relationship\CartsVouchersRelationshipResolver
        - relationshipName: cart-rules
          targetResource: CartRules
          resolverClass: Spryker\Glue\CartCodesRestApi\Api\Storefront\Relationship\CartsCartRulesRelationshipResolver
        - relationshipName: promotional-items
          targetResource: PromotionalItems
          resolverClass: Spryker\Glue\DiscountPromotionsRestApi\Api\Storefront\Relationship\CartsPromotionalItemsRelationshipResolver
        - relationshipName: gift-cards
          targetResource: GiftCards
          resolverClass: Spryker\Glue\GiftCardsRestApi\Api\Storefront\Relationship\CartsGiftCardsRelationshipResolver
        - relationshipName: bundle-items
          targetResource: BundleItems
          resolverClass: Spryker\Glue\ProductBundleCartsRestApi\Api\Storefront\Relationship\CartsBundleItemsRelationshipResolver

    properties:
        uuid:
            type: string
            identifier: true
            writable: false
            readable: true
            required: false
            description: 'Unique guest cart identifier'
            openapiContext:
                example: '1ce91011-8d60-59ef-9fe0-4493ef36c4f0'

        priceMode:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Price mode for the cart (GROSS_MODE or NET_MODE)'
            openapiContext:
                example: 'GROSS_MODE'

        currency:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Currency code for the cart'
            openapiContext:
                example: 'EUR'

        store:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Store name for the cart. Ignored on update — a cart keeps the store it was created in.'
            openapiContext:
                example: 'DE'

        name:
            type: string
            writable: true
            readable: true
            required: false
            description: 'Guest cart name'
            openapiContext:
                example: 'Guest Cart'

        isDefault:
            type: boolean
            writable: false
            readable: true
            required: false
            description: 'Whether this is the default cart'

        totals:
            type: object
            objectName: Totals
            writable: false
            readable: true
            required: false
            description: 'Calculated cart totals in cents. `subtotal` is items × prices before any discount/tax; `discountTotal` is the sum of all applied discounts; `taxTotal` is tax computed against the discounted base; `expenseTotal` is the sum of shipping/handling expenses; `grandTotal` is what the customer pays; `priceToPay` is the same value adjusted for any pre-paid amount (e.g. gift cards).'
            properties:
                subtotal:
                    type: integer
                    responseOptional: true
                    description: "Items × prices before any discount/tax. The calculator writes the cart's totals, so a cart that holds nothing - a cart just created, or one whose last item was removed - carries none."
                    openapiContext:
                        example: 16058
                discountTotal:
                    type: integer
                    responseOptional: true
                    description: "Sum of all applied discounts. The calculator writes the cart's totals, so a cart that holds nothing - a cart just created, or one whose last item was removed - carries none."
                    openapiContext:
                        example: 1457
                taxTotal:
                    type: integer
                    responseOptional: true
                    description: "Tax computed against the discounted base. The calculator writes the cart's totals, so a cart that holds nothing - a cart just created, or one whose last item was removed - carries none."
                    openapiContext:
                        example: 2562
                expenseTotal:
                    type: integer
                    responseOptional: true
                    description: "Sum of shipping/handling expenses. The calculator writes the cart's totals, so a cart that holds nothing - a cart just created, or one whose last item was removed - carries none."
                    openapiContext:
                        example: 0
                grandTotal:
                    type: integer
                    responseOptional: true
                    description: "What the customer pays. The calculator writes the cart's totals, so a cart that holds nothing - a cart just created, or one whose last item was removed - carries none."
                    openapiContext:
                        example: 14601
                priceToPay:
                    type: integer
                    responseOptional: true
                    description: "Grand total adjusted for any pre-paid amount (e.g. gift cards). The calculator writes the cart's totals, so a cart that holds nothing - a cart just created, or one whose last item was removed - carries none."
                    openapiContext:
                        example: 14601

        discounts:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Discounts currently applied to the guest cart, summarized for display. Each entry carries the discount `displayName`, total `amount` in cents, and the `code` used to apply it (null for rule-based discounts).'
            openapiContext:
                items:
                    type: object
                    required:
                        - displayName
                        - amount
                        - code
                    properties:
                        displayName:
                            type: string
                        amount:
                            type: integer
                        code:
                            type: string
                            nullable: true
                            description: 'Voucher code; null for a rule-based discount.'
                example:
                    - displayName: '10% Discount for all orders above'
                      amount: 1457
                      code: 'VOUCHER10'

        thresholds:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Sales-order threshold messages produced by `SalesOrderThresholdConfig` rules. Each entry tells the customer how their guest cart relates to a configured threshold (soft warnings, hard blockers, free-shipping nudges).'
            openapiContext:
                items:
                    type: object
                    required:
                        - type
                        - threshold
                        - fee
                        - deltaWithSubtotal
                        - message
                    properties:
                        type:
                            type: string
                        threshold:
                            type: integer
                        fee:
                            type: integer
                            nullable: true
                        deltaWithSubtotal:
                            type: integer
                        message:
                            type: string
                            nullable: true
                example:
                    - type: 'soft-minimum-threshold'
                      threshold: 5000
                      message: 'You are €5.00 short of free shipping'
                      deltaWithSubtotal: 500
                      fee: 590

        amendmentOrderReference:
            type: string
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'Order reference when the cart is an amendment of an existing order. Answered only for such a cart; an ordinary shopping cart carries none. The populated case is pinned by the OrderAmendments suite.'
            openapiContext:
                example: 'DE--1'

        voucherDiscounts:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Voucher-code discounts currently applied to the guest cart, surfaced as the `vouchers` relationship when the response is requested with `?include=vouchers`.'

        cartRuleDiscounts:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Automatic (rule-based) discounts currently applied to the guest cart, surfaced as the `cart-rules` relationship when the response is requested with `?include=cart-rules`.'

        promotionItems:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Promotional items the guest is eligible to add to the cart based on active discount promotions, surfaced as the `promotional-items` relationship when requested with `?include=promotional-items`.'

        giftCards:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Gift cards already redeemed against the guest cart, surfaced as the `gift-cards` relationship when requested with `?include=gift-cards`.'

        bundleItems:
            type: array
            writable: false
            readable: false
            required: false
            description: 'Bundle parent records for guest-cart items that originate from a product bundle. Used both by the `bundle-items` relationship and by the `guest-cart-items` relationship — bundled-out concrete items are folded back into a single bundle entry so the customer sees one row per bundle instead of N rows per component.'

        items:
            type: array
            writable: false
            readable: false
            required: false
            description: 'All guest-cart items (incl. bundled-out components and configured-bundle slots), surfaced as the `guest-cart-items` relationship when requested with `?include=guest-cart-items`. The configured `CartItemFilterPluginInterface` chain runs over this collection — for example, bundled items are collapsed into their bundle parents.'
